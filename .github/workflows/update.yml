name: Update Surfboard Nodes
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y jq

      - name: Fetch & update PureNodes.conf
        env:
          SUB_URL: "https://212.47.238.39/api/v1/client/subscribe?token=73fef174bcddb30d5ec96ec8c8476b8c&flag=singbox"
        run: |
          # 拉取订阅
          curl -sL --insecure \
            -H "User-Agent: sing-box/1.10.0 (linux; amd64)" \
            "$SUB_URL" -o singbox.json

          # 生成新节点
          jq -c '.outbounds[] | select(.type=="shadowsocks" or .type=="anytls" or .type=="hysteria2")' singbox.json | sort | while read -r obj; do
            tag=$(echo "$obj" | jq -r '.tag')
            type=$(echo "$obj" | jq -r '.type')
            server=$(echo "$obj" | jq -r '.server')
            port=$(echo "$obj" | jq -r '.server_port')
            pass=$(echo "$obj" | jq -r '.password')
            sni=$(echo "$obj" | jq -r '.tls.server_name // empty')
            insecure=$(echo "$obj" | jq -r '.tls.insecure // false')
            skip=$([ "$insecure" = "true" ] && echo "skip-cert-verify=true" || echo "")

            case "$type" in
              shadowsocks)
                method=$(echo "$obj" | jq -r '.method')
                echo "$tag = ss, $server, $port, $method, $pass, udp-relay=true"
                ;;
              anytls)
                echo "$tag = anytls, $server, $port, $pass, udp-relay=true${sni:+, sni=$sni}${skip:+, $skip}"
                ;;
              hysteria2)
                obfs=$(echo "$obj" | jq -r '.obfs.password // empty')
                echo "$tag = hysteria2, $server, $port, password=$pass, download-bandwidth=1000, upload-bandwidth=1000, udp-relay=true${sni:+, sni=$sni}${skip:+, $skip}${obfs:+, salamander-password=$obfs}"
                ;;
            esac
          done > new_nodes.txt

          # 精准更新：保留全部内容 → 清空 [Proxy] 内旧节点 → 写入新节点
          if [ -f PureNodes.conf ]; then
            awk '
              /^\[Proxy\]/ { print; exit }
              { print }
            ' PureNodes.conf > head.txt

            awk '
              f { print }
              /^\[Proxy\]/ { f=1 }
              /^\[/ && f { print; exit }
            ' PureNodes.conf | tail -n +2 > tail.txt

            cat head.txt new_nodes.txt tail.txt > PureNodes.conf
            rm -f head.txt tail.txt
          else
            echo -e "[General]\ndns-server = 223.5.5.5, 119.29.29.29\n[Proxy]" > PureNodes.conf
            cat new_nodes.txt >> PureNodes.conf
          fi

          rm -f singbox.json new_nodes.txt
          echo "✅ 更新完成：$(grep -c '=' PureNodes.conf) 个节点"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PureNodes.conf
          git commit -m "update: $(date +'%Y-%m-%d %H:%M') nodes" || true
          git push || true
