name: PureNodes 自动更新
run-name: 正在刷新节点

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 subconverter
        run: |
          wget -q https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar xf subconverter_linux64.tar.gz
          chmod +x subconverter/subconverter

      - name: 生成仅节点配置
        run: echo -e '[common]\nenable_udp = true\nadd_rule = false\nadd_group = false\nadd_proxy_group = false\ndns = ""\nipv6 = false\nsort = false' > pure.ini

      - name: 执行转换
        run: |
          SUBS=$(grep -v '^#' source.txt | grep -v '^$')
          mkdir -p ./output
          ./subconverter/subconverter --generate --config pure.ini --path ./output/ --output nodes.txt $SUBS
          ./subconverter/subconverter --generate --type clash --config pure.ini --path ./output/ --output nodes_clash.yaml $SUBS
          ./subconverter/subconverter --generate --type surfboard --config pure.ini --path ./output/ --output nodes_surfboard.conf $SUBS

      - name: 提交推送
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ./output/
          git commit -m "更新节点 $(date +'%Y-%m-%d %H:%M')" --allow-empty
          git push
