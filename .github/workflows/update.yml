name: PureNodes 自动更新
run-name: 正在刷新节点

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 subconverter
        run: |
          wget -q --timeout=30 https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar xf subconverter_linux64.tar.gz
          chmod +x subconverter/subconverter

      - name: 生成极简配置
        run: |
          echo '[common]' > pure.ini
          echo 'enable_udp = true' >> pure.ini
          echo 'add_rule = false' >> pure.ini
          echo 'add_group = false' >> pure.ini
          echo 'add_proxy_group = false' >> pure.ini
          echo 'dns = ""' >> pure.ini
          echo 'ipv6 = false' >> pure.ini
          echo 'sort = false' >> pure.ini
          echo 'enable_rule_generator = false' >> pure.ini
          echo 'prepend_rule = false' >> pure.ini
          echo 'append_rule = false' >> pure.ini
          echo 'retain_original_proxy = true' >> pure.ini
          echo 'disable_external_snippets = true' >> pure.ini
          echo 'skip_certificate_verify = true' >> pure.ini

      - name: 读取订阅并自动处理 Base64
        run: |
          SUBS=$(grep -v '^#' source.txt | grep -v '^$')
          echo "✅ 原始订阅：$SUBS"

          # 先下载内容
          curl -L --connect-timeout 15 --max-time 60 "$SUBS" -o raw_sub.txt

          # 检测是否是 Base64，是就解码
          if base64 -d raw_sub.txt > decoded_sub.txt 2>/dev/null && [ -s decoded_sub.txt ]; then
            echo "✅ 检测到 Base64，已自动解码"
            FINAL_SUB="./decoded_sub.txt"
          else
            echo "ℹ️ 非 Base64，直接使用原始内容"
            FINAL_SUB="./raw_sub.txt"
          fi

          echo "FINAL_SUB=$FINAL_SUB" >> $GITHUB_ENV

      - name: 执行转换（使用解码后内容）
        run: |
          mkdir -p ./output
          rm -f ./output/*
          SUB_FILE="${{ env.FINAL_SUB }}"

          timeout 90 ./subconverter/subconverter --generate --config pure.ini --path ./output/ --output nodes.txt --exclude-rules --exclude-groups --retry 2 --timeout 15 "$SUB_FILE"
          timeout 90 ./subconverter/subconverter --generate --type clash --config pure.ini --path ./output/ --output nodes_clash.yaml --exclude-rules --exclude-groups --retry 2 --timeout 15 "$SUB_FILE"
          timeout 90 ./subconverter/subconverter --generate --type surfboard --config pure.ini --path ./output/ --output nodes_surfboard.conf --exclude-rules --exclude-groups --retry 2 --timeout 15 "$SUB_FILE"

          echo "✅ 完成，文件与行数："
          ls -lh ./output/
          wc -l ./output/*

      - name: 提交推送
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ./output/
          git commit -m "更新节点 $(date +'%Y-%m-%d %H:%M')" --allow-empty
          git push
