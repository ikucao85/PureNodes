name: PureNodes 自动更新
run-name: 正在刷新节点

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y jq

      - name: 拉取并解析订阅
        run: |
          SUBS=$(grep -v '^#' source.txt | grep -v '^$')
          [ -z "$SUBS" ] && echo "❌ source.txt 无链接" && exit 1
          echo "✅ 订阅链接：$SUBS"

          # 下载内容，超时控制
          curl -L --connect-timeout 15 --max-time 60 "$SUBS" -o raw.txt -s -S
          [ ! -s raw.txt ] && echo "❌ 订阅内容为空" && exit 1

          # 自动 Base64 解码
          if base64 -d raw.txt > decoded.txt 2>/dev/null && [ -s decoded.txt ]; then
            mv decoded.txt content.txt
            echo "✅ 已自动解码 Base64"
          else
            mv raw.txt content.txt
            echo "ℹ️ 非 Base64，直接使用"
          fi

          # 提取所有节点链接（ss/ssr/vmess/trojan/anytls/socks5/http）
          grep -E '^(ss|ssr|vmess|trojan|anytls|socks5|http)://' content.txt > nodes.txt || true
          echo "✅ 提取到 $(wc -l < nodes.txt) 个节点"
          [ ! -s nodes.txt ] && echo "❌ 未识别到任何节点" && exit 1

          # 生成 Clash 纯节点格式
          echo "proxies:" > nodes_clash.yaml
          while IFS= read -r line; do
            echo "$line" | sed 's/^/  - /' >> nodes_clash.yaml
          done < nodes.txt

          # 生成 Surfboard 纯节点格式
          echo "[Proxy]" > nodes_surfboard.conf
          cat nodes.txt >> nodes_surfboard.conf

          # 移到输出目录
          mkdir -p ./output
          mv nodes.txt nodes_clash.yaml nodes_surfboard.conf ./output/
          echo "✅ 完成，文件列表："
          ls -lh ./output/

      - name: 提交推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./output/
          git commit -m "更新节点 $(date +'%Y-%m-%d %H:%M')" --allow-empty
          git push
