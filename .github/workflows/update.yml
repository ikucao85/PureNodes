name: Update Surfboard Nodes
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *' # 每日 16:00 更新

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取并转换节点
        env:
          SUB_URL: "https://212.47.238.39/api/v1/client/subscribe?token=73fef174bcddb30d5ec96ec8c8476b8c&flag=singbox"
        run: |
          # 伪装 UA 拉取，跳过证书校验
          curl -sL --insecure \
            -H "User-Agent: sing-box/1.10.0 (linux; amd64)" \
            "$SUB_URL" -o config.json

          # 用 jq 解析 + 生成 Surfboard 节点
          cat > generate.sh <<'SH'
          #!/bin/bash
          echo "[Proxy]"
          jq -r '.outbounds[] | select(.type=="shadowsocks" or .type=="anytls" or .type=="hysteria2") | @base64' config.json | while read -r line; do
            echo "$line" | base64 -d | jq -c '.'
          done | while read -r obj; do
            tag=$(echo "$obj" | jq -r '.tag')
            type=$(echo "$obj" | jq -r '.type')
            server=$(echo "$obj" | jq -r '.server')
            port=$(echo "$obj" | jq -r '.server_port')
            password=$(echo "$obj" | jq -r '.password')
            sni=$(echo "$obj" | jq -r '.tls.server_name // empty')
            insecure=$(echo "$obj" | jq -r '.tls.insecure // false')
            skip=$([ "$insecure" = "true" ] && echo "skip-cert-verify=true" || echo "")

            case "$type" in
              shadowsocks)
                method=$(echo "$obj" | jq -r '.method')
                echo "$tag = ss, $server, $port, $method, $password, udp-relay=true"
                ;;
              anytls)
                echo "$tag = anytls, $server, $port, $password, udp-relay=true, $skip ${sni:+sni=$sni}"
                ;;
              hysteria2)
                obfs=$(echo "$obj" | jq -r '.obfs.password // empty')
                echo "$tag = hysteria2, $server, $port, password=$password, download-bandwidth=1000, upload-bandwidth=1000, udp-relay=true, $skip ${sni:+sni=$sni} ${obfs:+salamander-password=$obfs}"
                ;;
            esac
          done | sort > surfboard_nodes.conf
          echo "✅ 生成完成：$(grep -c '=' surfboard_nodes.conf) 个节点"
          head -5 surfboard_nodes.conf
          SH
          chmod +x generate.sh && sudo apt install -y jq && ./generate.sh

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add surfboard_nodes.conf
          git commit -m "update: $(date +'%Y-%m-%d %H:%M') nodes" || true
          git push || true
