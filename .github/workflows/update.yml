name: PureNodes 自动更新
run-name: 正在刷新节点

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 subconverter
        run: |
          wget -q https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar xf subconverter_linux64.tar.gz
          chmod +x subconverter/subconverter

      - name: 生成极简配置（只节点，不拉任何远程）
        run: |
          cat > pure.ini << 'EOF'
[common]
enable_udp = true
add_rule = false
add_group = false
add_proxy_group = false
dns = ""
ipv6 = false
sort = false
# 👇 关键：关闭所有额外拉取
prepend_rule = false
append_rule = false
retain_original_proxy = true
enable_rule_generator = false
remove_special_characters = false
EOF

      - name: 读取订阅并校验
        run: |
          SUBS=$(grep -v '^#' source.txt | grep -v '^$')
          echo "✅ 有效订阅：$SUBS"
          [ -z "$SUBS" ] && echo "❌ source.txt 无链接" && exit 1

      - name: 执行转换（加超时+禁止远程规则）
        run: |
          mkdir -p ./output
          rm -f ./output/*

          timeout 120 ./subconverter/subconverter \
            --generate \
            --config pure.ini \
            --path ./output/ \
            --output nodes.txt \
            --exclude-rules \
            --exclude-groups \
            --prefer-ip \
            $SUBS

          timeout 120 ./subconverter/subconverter \
            --generate --type clash \
            --config pure.ini \
            --path ./output/ --output nodes_clash.yaml \
            --exclude-rules --exclude-groups $SUBS

          timeout 120 ./subconverter/subconverter \
            --generate --type surfboard \
            --config pure.ini \
            --path ./output/ --output nodes_surfboard.conf \
            --exclude-rules --exclude-groups $SUBS

          echo "✅ 转换完成，文件列表："
          ls -lh ./output/

      - name: 提交推送
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ./output/
          git commit -m "更新节点 $(date +'%Y-%m-%d %H:%M')" --allow-empty
          git push
