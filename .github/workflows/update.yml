name: PureNodes 自动更新
run-name: 正在刷新节点

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 拉取订阅并预处理
        run: |
          SUBS=$(grep -v '^#' source.txt | grep -v '^$')
          [ -z "$SUBS" ] && echo "❌ source.txt 无链接" && exit 1
          echo "✅ 订阅链接：$SUBS"

          curl -L --connect-timeout 15 --max-time 60 "$SUBS" -o raw.txt -s -S
          [ ! -s raw.txt ] && echo "❌ 订阅内容为空" && exit 1

          if base64 -d raw.txt > decoded.txt 2>/dev/null && [ -s decoded.txt ]; then
            mv decoded.txt content.txt
            echo "✅ 已自动解码 Base64"
          else
            mv raw.txt content.txt
            echo "ℹ️ 非 Base64，直接使用"
          fi

      - name: 提取 → 强制清洗 → 排序
        run: |
          grep -E '^(ss|ssr|vmess|trojan|anytls|socks5|http)://' content.txt > raw_nodes.txt || true
          echo "✅ 提取到 $(wc -l < raw_nodes.txt) 个节点"
          [ ! -s raw_nodes.txt ] && echo "❌ 未识别到任何节点" && exit 1

          # 👇 强制清洗：专门修复 Surfboard 不兼容项
          sed -i '
            s/\?security, proxy type tls//g
            s/allowinsecure=/allowInsecure=/g
            s/&insecure=[01]//g
            s/#.*$//g
            s/[[:space:]]//g
          ' raw_nodes.txt

          # 仅排序：保留原始内容，不去任何字符
          awk '
          BEGIN{
            order["HK"]=1; order["港"]=1; order["Hong"]=1
            order["TW"]=2; order["台"]=2
            order["JP"]=3; order["日"]=3
            order["SG"]=4; order["新"]=4
            order["KR"]=5; order["韩"]=5
            order["US"]=6; order["美"]=6
            order["CN"]=7; order["中"]=7
          }
          {
            line=$0; rank=99
            for(k in order) if(index(line,k)) { rank=order[k]; break }
            print rank "|" line
          }
          ' raw_nodes.txt | sort -t'|' -k1,1n -k2,2 | cut -d'|' -f2 > sorted_nodes.txt

          echo "✅ 清洗+排序完成，共 $(wc -l < sorted_nodes.txt) 条有效节点"

      - name: 生成三种格式
        run: |
          cp sorted_nodes.txt nodes.txt
          echo "proxies:" > nodes_clash.yaml
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "  - $line" >> nodes_clash.yaml
          done < sorted_nodes.txt
          echo "[Proxy]" > nodes_surfboard.conf
          cat sorted_nodes.txt >> nodes_surfboard.conf
          mkdir -p ./output
          mv nodes.txt nodes_clash.yaml nodes_surfboard.conf ./output/
          echo "✅ 全部完成"

      - name: 提交推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./output/
          git commit -m "更新节点 $(date +'%Y-%m-%d %H:%M')" --allow-empty
          git push
