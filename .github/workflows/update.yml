name: Update Surfboard Nodes
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: sudo apt update && sudo apt install -y jq

      - name: 拉取订阅并生成 PureNodes.conf
        env:
          SUB_URL: "https://212.47.238.39/api/v1/client/subscribe?token=73fef174bcddb30d5ec96ec8c8476b8c&flag=singbox"
        run: |
          curl -sL --insecure \
            -H "User-Agent: sing-box/1.10.0 (linux; amd64)" \
            "$SUB_URL" -o singbox.json

          echo "# ==============================================" > PureNodes.conf
          echo "# PureNodes | Surfboard 专用节点列表" >> PureNodes.conf
          echo "# 自动更新：GitHub Actions" >> PureNodes.conf
          echo "# ==============================================" >> PureNodes.conf
          echo "" >> PureNodes.conf
          echo "[Proxy]" >> PureNodes.conf

          jq -r '
            .outbounds
            | map(select(.type == "shadowsocks" or .type == "anytls" or .type == "hysteria2"))
            | map(select(.tag | startswith("[ss]剩余流量") | not))
            | map(select(.tag | startswith("[ss]距离下次重置") | not))
            | map(select(.tag | startswith("[ss]套餐到期") | not))
            | map(select(.tag | startswith("[ss]如果看不到节点") | not))
            | sort_by(.tag)
            | .[] |
              [
                .tag,
                .type,
                .server,
                .server_port,
                .password,
                .method // "",
                (.tls.server_name // ""),
                (if .tls.insecure == true then "true" else "false" end),
                (.obfs.password // "")
              ] | @tsv
          ' singbox.json | while IFS=$'\t' read -r tag type server port password method sni insecure obfs; do
            skip=""
            [ "$insecure" = "true" ] && skip="skip-cert-verify=true"
            case "$type" in
              shadowsocks)
                echo "$tag = ss, $server, $port, $method, $password, udp-relay=true" >> PureNodes.conf
                ;;
              anytls)
                args="udp-relay=true"
                [ -n "$skip" ] && args="$args, $skip"
                [ -n "$sni" ] && args="$args, sni=$sni"
                echo "$tag = anytls, $server, $port, $password, $args" >> PureNodes.conf
                ;;
              hysteria2)
                args="download-bandwidth=1000, upload-bandwidth=1000, udp-relay=true"
                [ -n "$skip" ] && args="$args, $skip"
                [ -n "$sni" ] && args="$args, $sni"
                [ -n "$obfs" ] && args="$args, salamander-password=$obfs"
                echo "$tag = hysteria2, $server, $port, password=$password, $args" >> PureNodes.conf
                ;;
            esac
          done

          echo "✅ 完成：$(grep -c '=' PureNodes.conf) 个节点已写入"
          echo "📄 预览："
          head -15 PureNodes.conf

      - name: 提交更新
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add PureNodes.conf
          git commit -m "update: $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') 节点更新" || true
          git push || true
