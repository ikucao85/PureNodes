name: PureNodes 自动更新
run-name: 正在刷新节点

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 subconverter
        run: |
          wget -q https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar xf subconverter_linux64.tar.gz
          chmod +x subconverter/subconverter

      - name: 生成极简配置
        run: echo '[common]' > pure.ini && echo 'enable_udp = true' >> pure.ini && echo 'add_rule = false' >> pure.ini && echo 'add_group = false' >> pure.ini && echo 'add_proxy_group = false' >> pure.ini && echo 'dns = ""' >> pure.ini && echo 'ipv6 = false' >> pure.ini && echo 'sort = false' >> pure.ini && echo 'enable_rule_generator = false' >> pure.ini

      - name: 读取并校验订阅
        run: |
          SUBS=$(grep -v '^#' source.txt | grep -v '^$')
          echo "有效订阅：$SUBS"
          if [ -z "$SUBS" ]; then exit 1; fi

      - name: 执行转换
        run: |
          mkdir -p ./output
          rm -f ./output/*
          timeout 120 ./subconverter/subconverter --generate --config pure.ini --path ./output/ --output nodes.txt --exclude-rules --exclude-groups $SUBS
          timeout 120 ./subconverter/subconverter --generate --type clash --config pure.ini --path ./output/ --output nodes_clash.yaml --exclude-rules --exclude-groups $SUBS
          timeout 120 ./subconverter/subconverter --generate --type surfboard --config pure.ini --path ./output/ --output nodes_surfboard.conf --exclude-rules --exclude-groups $SUBS
          ls -lh ./output/

      - name: 提交推送
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ./output/
          git commit -m "更新节点 $(date +'%Y-%m-%d %H:%M')" --allow-empty
          git push
