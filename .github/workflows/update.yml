name: PureNodes 自动更新
run-name: 正在刷新节点

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 拉取订阅（伪装UA+抗超时）
        run: |
          SUBS=$(grep -v '^#' source.txt | grep -v '^$')
          [ -z "$SUBS" ] && exit 1
          curl -L \
            --connect-timeout 30 \
            --max-time 120 \
            --retry 5 \
            --retry-delay 5 \
            -A "ClashforWindows/0.20.39" \
            --insecure \
            "$SUBS" -o raw.txt -s -S
          [ ! -s raw.txt ] && exit 1

          # ===== 解码控制区 =====
          # 若确认永远明文，把下面两行替换为：mv raw.txt content.txt
          base64 -d raw.txt > decoded.txt 2>/dev/null && mv decoded.txt content.txt || mv raw.txt content.txt
          echo "✅ 内容处理完成"

      - name: 提取+过滤+排序
        run: |
          grep -E '^(ss|ssr|vmess|anytls|socks5|http)://' content.txt > raw_nodes.txt || true
          [ ! -s raw_nodes.txt ] && exit 1
          awk 'BEGIN{h["HK"]=1;h["港"]=1;h["TW"]=2;h["台"]=2;h["JP"]=3;h["日"]=3;h["SG"]=4;h["新"]=4;h["US"]=5;h["美"]=5} {l=$0;r=99;for(k in h)if(index(l,k)){r=h[k];break} print r"|"l}' raw_nodes.txt | sort -t'|' -k1,1n -k2 | cut -d'|' -f2 > sorted.txt

      - name: 生成格式
        run: |
          mkdir -p output
          cp sorted.txt output/nodes.txt
          awk '{print "  - "$0}' sorted.txt > output/nodes_clash.yaml
          echo "[Proxy]" > output/nodes_surfboard.conf
          cat sorted.txt >> output/nodes_surfboard.conf

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "更新 $(date +'%Y%m%d %H:%M')" --allow-empty
          git push
